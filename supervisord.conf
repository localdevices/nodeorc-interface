[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:fastapi]
command=uvicorn orc_api.main:app --host 0.0.0.0 --port 5000 --timeout-keep-alive 120 --workers 1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:celery_worker]
# Enforces exactly 1 video task at a time, recycling processes to clear memory leaks
command=celery -A orc_api.celery_app worker --concurrency=1 --max-tasks-per-child=1 --loglevel=info
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
